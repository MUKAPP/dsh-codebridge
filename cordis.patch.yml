- insert:
    - id: codebridge-runtime
      name: '@deepseek-ai/dsh-ptc-runtime-node'
      isolate:
        ptcRuntime: dsh-codebridge-runtime
      config:
        executionMode: persistent-in-memory
    - id: codebridge
      name: dsh-codebridge
      isolate:
        ptcRuntime: dsh-codebridge-runtime
      config:
        retainSessionState: true
        restoreOnRestart: false
