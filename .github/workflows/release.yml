name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6

      - name: Verify release version
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
      - name: Type check
        run: pnpm run typecheck
      - name: Build and pack plugin
        run: pnpm pack --pack-destination artifacts
      - name: Test plugin
        run: pnpm test

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="artifacts/dsh-codebridge-${GITHUB_REF_NAME#v}.tgz"
          gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
